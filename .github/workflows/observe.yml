name: Birleşik gözlem
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
concurrency:
  group: combined-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python run.py
      - name: Persist new observation only when changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state/latest.json state/observations.jsonl
          git add -f state/forward_ledger.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: birleşik gözlemi güncelle"
          git push

