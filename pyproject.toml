[project]
name = "temel-eaverse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=2.1", "streamlit>=1.40"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["app", "config", "engine", "models", "methods", "run", "sources", "storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

