name: State health
on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"
permissions:
  contents: read
concurrency:
  group: state-health
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python health.py
