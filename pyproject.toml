[project]
name = "temel-eaverse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=3.1.1", "streamlit>=1.40"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["app", "config", "corroboration", "data_quality", "engine", "forward", "health", "methods", "models", "orchestrator", "portfolio", "promotion", "run", "sources", "storage", "validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

